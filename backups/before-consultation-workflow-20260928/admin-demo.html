<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>마이롯지 · 상담 관리 시안</title><link rel="stylesheet" href="styles.css"><style>
body{background:#eef3ee;padding:36px 20px}.ops{max-width:1120px;margin:auto}.ops-heading{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:24px}.ops h1{font-size:32px;margin:0}.ops h2{font-size:22px}.ops-note{padding:18px 22px;background:#dcebe0;border-radius:14px;margin:24px 0;font-size:14px}.ops-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.ops-card{background:white;border:1px solid #d8e2d9;border-radius:20px;padding:24px}.ops-filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.request{width:100%;padding:18px;text-align:left;border:1px solid #dce5de;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:16px}.request[aria-pressed=true]{border-color:#19594d;background:#eef8f0}.request small{display:block;color:#65766a;margin-top:6px}.ops label{display:block;font-size:13px;margin:16px 0 6px}.ops select{width:100%;padding:12px;border:1px solid #cad9cc;border-radius:10px;background:#f7f9f5;font:inherit}.ops textarea{width:100%}.ops-status{font-size:12px;color:#19594d;white-space:nowrap}.ops ul{font-size:13px;padding-left:20px;line-height:1.9}.ops .primary{margin-top:18px}.ops dl>div{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #e5ebe4;font-size:14px}.ops dd{margin:0}.ops dt{color:#68776c}.ops [role=status]{font-size:13px;color:#19594d;margin-top:12px}.ops-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:760px){.ops-layout{grid-template-columns:1fr}.ops-heading{align-items:start;flex-direction:column}.ops h1{font-size:26px}}
</style></head><body><main class="ops"><div class="ops-heading"><div><p class="eyebrow">MY LODGE · 운영 화면 시안</p><h1>상담 관리</h1></div><div class="ops-toolbar"><a class="outline" href="/#consultation">고객 화면 보기</a><button type="button" class="outline" id="reset">예시 초기화</button></div></div><p class="ops-note">가상 문의 3건으로 처리 흐름을 살펴보는 화면입니다. 실제 상담과 연결되지 않으며 변경 사항은 새로고침하면 사라집니다. 실제 개인정보를 입력하지 마세요.</p><div class="ops-layout"><section class="ops-card" style="padding:24px"><h2>문의 목록</h2><div class="ops-filters" role="group" aria-label="처리 상태 필터"></div><div id="requests"></div><p id="list-status" role="status"></p></section><section class="ops-card" style="padding:24px" aria-label="문의 상세"><h2 id="detail-title">문의 상세</h2><dl id="detail"></dl><label for="owner">담당자</label><select id="owner"><option>미배정</option><option>담당자 A (가상)</option><option>담당자 B (가상)</option></select><label for="status">처리 상태</label><select id="status"><option>신규</option><option>연락 예정</option><option>상담 중</option><option>완료</option></select><label for="note">처리 메모 · 예시만 입력</label><textarea id="note" rows="3" maxlength="500" placeholder="예: 참여 조건 설명 예정"></textarea><button type="button" class="primary" id="apply">예시에 반영</button><p role="status" id="saved"></p><h3 style="margin-top:24px;font-size:15px">처리 이력</h3><ul id="history"></ul></section></div></main><script>
const initial=()=>[
 {id:'DEMO-001',name:'예시 고객 A',region:'주문진',topic:'비용·분납',time:'날짜 미정 · 오후 희망',question:'최초 납입과 추가 비용이 궁금합니다.',owner:'미배정',status:'신규',note:'',history:['가상 문의 생성']},
 {id:'DEMO-002',name:'예시 고객 B',region:'양양',topic:'공동소유',time:'언제든 괜찮아요',question:'구좌와 이용 권리의 차이를 알고 싶습니다.',owner:'담당자 A (가상)',status:'연락 예정',note:'',history:['가상 문의 생성','담당자 A 배정 · 예시']},
 {id:'DEMO-003',name:'예시 고객 C',region:'미정',topic:'이용 방법',time:'날짜 미정 · 오전 희망',question:'지역 교환 서비스에 관심이 있습니다.',owner:'담당자 B (가상)',status:'완료',note:'',history:['가상 문의 생성','상담 완료 · 예시']}
];
let data=initial(),selected='DEMO-001',filter='전체';
const $=selector=>document.querySelector(selector);
function renderList(){
 const filters=$('.ops-filters');filters.replaceChildren();
 ['전체','신규','연락 예정','상담 중','완료'].forEach(value=>{const b=document.createElement('button');b.className='toggle';b.textContent=value;b.setAttribute('aria-pressed',String(filter===value));b.onclick=()=>{filter=value;renderList();};filters.append(b);});
 const visible=data.filter(item=>filter==='전체'||item.status===filter),list=$('#requests');list.replaceChildren();
 visible.forEach(item=>{const b=document.createElement('button');b.className='request';b.setAttribute('aria-pressed',String(selected===item.id));const name=document.createElement('span'),small=document.createElement('small'),status=document.createElement('span');name.textContent=item.name;small.textContent=item.id+' · '+item.region+' · '+item.topic;name.append(small);status.className='ops-status';status.textContent=item.status;b.append(name,status);b.onclick=()=>{selected=item.id;renderList();renderDetail();};list.append(b);});
 $('#list-status').textContent=visible.length+'건 · 가상 데이터';
}
function renderDetail(){
 const item=data.find(row=>row.id===selected);$('#detail-title').textContent=item.id+' 상세';$('#detail').replaceChildren();
 [['이름',item.name],['연락처','가상 데이터 · 실제 번호 없음'],['관심 지역',item.region],['희망 시간',item.time],['문의',item.question]].forEach(([label,value])=>{const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;row.append(dt,dd);$('#detail').append(row);});
 $('#owner').value=item.owner;$('#status').value=item.status;$('#note').value=item.note;$('#saved').textContent='';$('#history').replaceChildren();item.history.forEach(text=>{const li=document.createElement('li');li.textContent=text;$('#history').append(li);});
}
$('#apply').onclick=()=>{const item=data.find(row=>row.id===selected);item.owner=$('#owner').value;item.status=$('#status').value;item.note=$('#note').value.trim();item.history.push(new Date().toLocaleTimeString('ko-KR')+' · '+item.owner+' · '+item.status+(item.note?' · '+item.note:''));renderList();renderDetail();$('#saved').textContent='예시에 반영했습니다. 서버 저장·고객 알림은 없습니다.';};
$('#reset').onclick=()=>{data=initial();selected='DEMO-001';filter='전체';renderList();renderDetail();};renderList();renderDetail();
</script></body></html>
