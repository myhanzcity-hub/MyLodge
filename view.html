<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex">
 <title>마이롯지 · 화면 보기</title>
 <link rel="stylesheet" href="tokens.css">
 <script>
  const viewParams=new URLSearchParams(location.search);
  const viewMode=viewParams.get('view');
  if(viewMode==='desktop')document.querySelector('meta[name=viewport]').content='width=1280,viewport-fit=cover';
 </script>
 <style>
  html,body{margin:0;width:100%;height:100%;background:var(--ui-ivory)}
  iframe{display:block;border:0;height:100%;width:100%;margin:0 auto;background:var(--ui-ivory)}
  body[data-view=mobile] iframe{max-width:430px;box-shadow:0 0 32px rgb(var(--ui-charcoal-rgb) / 0.149)}
  body[data-view=desktop] iframe{min-width:1280px}
 </style>
</head>
<body>
 <iframe title="마이롯지 홈페이지" id="site-screen" allow="autoplay; fullscreen"></iframe>
 <script>
  const chosenView=viewMode==='desktop'?'desktop':'mobile';
  document.body.dataset.view=chosenView;
  const allowedPages=['domestic-villas.html','business-valley.html'];
  const requestedPage=viewParams.get('page');
  const siteUrl=new URL(allowedPages.includes(requestedPage)?requestedPage:'./',location.href);
  siteUrl.search=location.search;
  siteUrl.searchParams.delete('view');
  siteUrl.searchParams.delete('page');
  siteUrl.searchParams.set('screen-frame',chosenView);
  siteUrl.hash=location.hash;
  const siteFrame=document.getElementById('site-screen');
  siteFrame.src=siteUrl.href;
  if(viewParams.get('lang')==='en'){
   document.documentElement.lang='en';document.title='MyLodge · Screen view';siteFrame.title='MyLodge website';
  }
  // Keep the wrapper URL shareable after category navigation and language changes.
  siteFrame.addEventListener('load',()=>{
   const child=siteFrame.contentWindow;
   function sync(){
    try{
     const next=new URL(location.href),current=new URL(child.location.href);
     if(current.origin!==location.origin)return;
     const currentPage=current.pathname.split('/').pop();
     if(allowedPages.includes(currentPage))next.searchParams.set('page',currentPage);
     else if(currentPage===''||currentPage==='index.html')next.searchParams.delete('page');
     else return;
     next.hash=current.hash;
     if(current.searchParams.has('lang'))next.searchParams.set('lang',current.searchParams.get('lang'));
     else next.searchParams.delete('lang');
     history.replaceState(null,'',next);
    }catch(error){/* External destinations manage their own navigation. */}
   }
   try{
    child.addEventListener('hashchange',sync);
    child.addEventListener('popstate',sync);
    child.document.addEventListener('click',()=>setTimeout(sync,0));
    sync();
   }catch(error){/* Cross-origin destinations remain usable. */}
  });
 </script>
</body>
</html>
