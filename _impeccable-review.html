<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block}</style>
<iframe id="page" src="index.html" title="홈페이지 검토"></iframe>
<script>
 const frame=document.querySelector('#page');
 frame.addEventListener('load',()=>setTimeout(()=>{
  const target=new URLSearchParams(location.search).get('target');
  frame.contentWindow.document.getElementById(target)?.scrollIntoView({block:'start'});
 },1800));
</script>
</html>
